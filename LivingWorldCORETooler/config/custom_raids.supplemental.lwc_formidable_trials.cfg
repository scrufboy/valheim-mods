# Living World C.O.R.E. — Formidable companion trials
#
# These are deliberate, console-triggered RandomEvent entries. Random=false keeps
# them out of the ordinary world raid pool. A very long SpawnInterval gives each
# event one bounded opening group without globally changing vanilla raid behavior.

