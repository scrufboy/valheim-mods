# Living World C.O.R.E. — Souls competitive telemetry raids
#
# Spawn law cloned from Valheim's army_theelder event:
#   duration 120 s; ordinary groups 1-3; population caps 6 and 4;
#   specialist and heavy caps 1; 5 s checks; group radius 3;
#   10 m same-prefab suppression for specialist/heavy slots.
#
# Deliberate test-boundary differences:
#   - explicit 70-95 m outer ring so approach and initiative are observable;
#   - HuntPlayer=true, so every hostile slot performs normal raid pursuit from the outer ring;
#   - one common hostile faction so Souls actors do not fight each other;
#   - NearBaseOnly=false so the elevated and MOUT arenas both work.
# The full six-actor roster is active. NinoBosque and OrcBrute were previously
# quarantined from an unproven timing correlation; the live static audit found no
# defect in either definition. The installed lifecycle observer now gathers facts
# if the removal error recurs during an ordinary full-roster raid.

[LWC_Formidable_Souls_Forest]
Name = lwc_formidable_arena
Enabled = true
Random = false
NearBaseOnly = false
Duration = 120
StartMessage = The forest souls are moving
EndMessage = The forest souls withdraw
PauseIfNoPlayerInArea = true
ForceMusic = CombatEventL2
Faction = PlainsMonsters

